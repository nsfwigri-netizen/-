on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SOURCE_ZIP: spectra-fix4.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack sources
        run: |
          set -e
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Нет файла $SOURCE_ZIP в корне репозитория. Что лежит в корне:"
            ls -1
            exit 1
          fi
          unzip -q "$SOURCE_ZIP" -d unpacked
          # архив упакован как spectra/..., поэтому ищем папку с build.gradle
          SRC=$(dirname "$(find unpacked -maxdepth 3 -name build.gradle | head -1)")
          if [ -z "$SRC" ] || [ "$SRC" = "." ]; then
            echo "::error::В архиве не найден build.gradle"
            find unpacked -maxdepth 3
            exit 1
          fi
          echo "SRC=$SRC" >> $GITHUB_ENV
          echo "Собираем из: $SRC"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: ${{ env.SRC }}
        run: |
          set -e
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            # враппера в архиве нет — берём gradle, предустановленный на раннере
            gradle build --no-daemon --stacktrace
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: spectra-jar
          path: |
            ${{ env.SRC }}/build/libs/*.jar
            !${{ env.SRC }}/build/libs/*-sources.jar
          if-no-files-found: error
          
